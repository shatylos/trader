<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>

    <script src="https://unpkg.com/htmx.org@1.9.2"
            integrity="sha384-L6OqL9pRWyyFU3+/bjdSri+iIphTN/bvYyM37tICVyOJkWZLpP2vGn6VUEXgzg6h"
            crossorigin="anonymous"></script>

    <title>Asset transaction</title>
</head>

<body class="bg-dark text-white">


<div class="container">

    <header class="text-center">
        <h1>Asset transaction:</h1>
    </header>

    <main class="row md-12">
        <div class="row">
            <a href="/">Home</a>
        </div>

        <div class="clearfix"></div>
        <hr/>

        <div class="row">

            {{ .Message }}

            <form method="post" id="assetForm">
                <h5>Type:</h5>
                <select name="type">
                    <option value="deposit">Deposit</option>
                    <option value="withdraw">Withdraw</option>
                </select>
                <p></p>

                <h5>Amount:</h5>
                <input name="amount" type="number" step=".01"/>
                <p></p>

                <h5>Date / Time:</h5>
                <input name="datetime" type="datetime-local"/>
                <p></p>
                <input id="timezoneOffset" name="timezoneOffset" type="hidden"/>

                <input type="submit" />
            </form>
        </div>
    </main>

</div>

</body>
</html>

<script>
    document.getElementById("assetForm").addEventListener("submit", function() {
        // Get the timezone offset in minutes
        let offset = new Date().getTimezoneOffset();

        // Convert to hours and minutes (e.g., -300 for UTC-5:00)
        document.getElementById("timezoneOffset").value = offset;
    });
</script>
